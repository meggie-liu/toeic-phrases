<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC 片語題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1f3f0;--card:#fbfcfa;--ink:#1e2f4d;--sub:#5b6a80;--line:#cdd4cf;--ok:#4f7a45;--okbg:#e2ecdb;--ng:#b0503b;--ngbg:#f6e2dc;
--serif:"Noto Serif TC","Songti TC",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans)}
main{max-width:720px;margin:0 auto;padding:32px 20px 80px}
h1{font:700 clamp(26px,5vw,36px)/1.3 var(--serif);margin:0 0 6px}
.lead{color:var(--sub);margin:0 0 28px}
h2{font:700 15px var(--sans);margin:28px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #6f8fc9;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.65;margin-left:4px}
.mode{flex:1 1 200px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px}
.mode b{display:block}.mode span{font-size:13px;color:var(--sub)}
.mode[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.go{margin-top:32px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:700;font-size:17px}
.go:disabled{opacity:.4;cursor:not-allowed}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:22px}
.meta button{background:none;border:0;color:var(--sub);text-decoration:underline;padding:0}
.q{font:500 clamp(21px,4.4vw,27px)/1.75 var(--serif);margin:0 0 6px}
.q.cn{font-size:clamp(20px,4vw,24px)}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;padding:0 6px;color:transparent;transition:color .2s,border-color .2s}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.ng{color:var(--ng);border-color:var(--ng)}
.hint{color:var(--sub);margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px}
.opt kbd{font:13px var(--sans);color:var(--sub);min-width:1em}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ng{background:var(--ngbg);border-color:var(--ng)}
.opt:disabled{cursor:default}
.fb{margin-top:18px;border-left:4px solid var(--ink);background:var(--card);padding:12px 16px;border-radius:0 10px 10px 0}
.fb.ok{border-color:var(--ok)}.fb.ng{border-color:var(--ng)}
.fb p{margin:2px 0}.fb .en{font-family:var(--serif)}.fb .t{font-weight:700}
.next{margin-top:16px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 26px;font-weight:700}
.score{font:700 44px/1.2 var(--serif);margin:8px 0}
.wl{list-style:none;padding:0;margin:12px 0}
.wl li{border-bottom:1px solid var(--line);padding:10px 0}.wl small{display:block;color:var(--sub)}
.sec{background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:10px;padding:11px 20px;margin:6px 8px 0 0}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.two{display:flex;gap:10px}.two .go{margin-top:32px}.go.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.pt{font-size:13px;color:var(--sub);margin:0 0 8px}.fam{font-size:14px;color:var(--sub);margin:6px 0 0}.fam b{color:var(--ink);font-weight:500}
.card{display:flex;flex-direction:column;gap:10px;width:100%;min-height:260px;justify-content:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.card #rbtn{margin:0}.cp{font:700 clamp(24px,5vw,32px)/1.4 var(--serif)}.cm{font-size:19px}.ce{font:500 18px/1.7 var(--serif)}.cc,.ct{color:var(--sub)}
#rbtn .go{margin-top:16px}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>TOEIC 片語題庫</h1>
  <p class="lead">先複習卡片，再用 Part 5 題型測驗；答錯的會收進錯題本。</p>
  <h2>題型</h2>
  <div class="row" id="modes"></div>
  <h2>範圍（可複選，不選＝全部）</h2>
  <div class="row" id="cats"></div>
  <div class="row" id="series" style="margin-top:8px"></div>
  <h2>題數</h2>
  <div class="row" id="counts"></div>
  <div class="two"><button class="go" id="start">開始測驗</button><button class="go alt" id="rev">先複習卡片</button></div>
</section>

<section id="review" class="hide">
  <div class="bar"><i id="rb"></i></div>
  <div class="meta"><span id="rn"></span><button id="rq">結束複習</button></div>
  <button class="card" id="card" aria-live="polite"></button>
  <div class="two" id="rbtn"></div>
</section>

<section id="quiz" class="hide">
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="pn"></span><button id="quit">結束測驗</button></div>
  <p class="pt" id="pt"></p>
  <p class="q" id="qt"></p>
  <p class="hint" id="qh"></p>
  <div class="opts" id="qo"></div>
  <div id="fb"></div>
</section>

<section id="result" class="hide">
  <h1>測驗完成</h1>
  <div class="score" id="sc"></div>
  <ul class="wl" id="wl"></ul>
  <div id="ract"></div>
</section>
</main>

<script>

dden drop in sales this quarter?"],"pd":["to","of","with","on","in","into","from","at","by","about","as"]},{"l":"A","p":"Abstain from","m":"戒除、避免","ex":"Doctors advise patients to abstain from alcohol during medication.","cn":"醫生建議病人在服藥期間戒酒。","cz":["Doctors advise patients to ","abstain from"," alcohol during medication."],"v":"Abstain from","t":["動詞片語"],"h":"abstain","pp":["Doctors advise patients to abstain ","from"," alcohol during medication."],"pd":["to","of","with","for","on","in","into","at","by","about","as"]},{"l":"A","p":"At once / At a glance","m":"立刻 / 一眼看去","ex":"Please send the final report to my email at once.","cn":"請立刻把最終報告寄到我的信箱。","cz":["Please send the final report to my email ","at once","."],"v":"At once","t":["介系詞與副詞片語"],"h":""},{"l":"A","p":"All the way","m":"自始至終、一路上","ex":"The team supported the project all the way to completion.","cn":"團隊自始至終支持該專案直到完成。","cz":["The team supported the project ","all the way"," to completion."],"v":"All the way","t":["介系詞與副詞片語"],"h":""},{"l":"A","p":"As opposed to","m":"而不是...","ex":"We decided to focus on quality as opposed to quantity.","cn":"我們決定專注於品質，而不是數量。","cz":["We decided to focus on quality ","as opposed to"," quantity."],"v":"As opposed to","t":["介系詞與副詞片語"],"h":"","pp":["We decided to focus on quality as opposed ","to"," quantity."],"pd":["of","with","for","on","in","into","from","at","by","about","as"]},{"l":"A","p":"At the discretion of","m":"由...裁定、斟酌","ex":"Bonuses will be granted at the discretion of the management.","cn":"獎金將由管理高層裁定發放。","cz":["Bonuses will be granted ","at the discretion of"," the management."],"v":"At the discretion of","t":["介系詞與副詞片語"],"h":"","pp":["Bonuses will be granted at the discretion ","of"," the management."],"pd":["to","with","for","on","in","into","from","at","by","about","as"]},{"l":"A","p":"At large","m":"大致上、廣泛地","ex":"The community at large supported the decision to build a new library.","cn":"廣大社區民眾均支持興建新圖書館的決定。","cz":["The community ","at large"," supported the decision to build a new library."],"v":"At large","t":["介系詞與副詞片語"],"h":""},{"l":"A","p":"As per","m":"依照","ex":"The shipment was sent as per your instructions.","cn":"貨物已按照您的指示發送。","cz":["The shipment was sent ","as per"," your instructions."],"v":"As per","t":["介系詞與副詞片語"],"h":""},{"l":"A","p":"A great deal","m":"很多","ex":"The new software saves us a great deal of time.","cn":"這套新軟體為我們節省了大量的時間。","cz":["The new software saves us a ","great deal"," of time."],"v":"A great deal","t":["名詞・形容詞・術語"],"h":""},{"l":"A","p":"At a stretch","m":"連續地","ex":"He worked for eight hours at a stretch without taking a break.","cn":"他連續工作了八個小時都沒有休息。","t":["介系詞與副詞片語"],"h":""},{"l":"A","p":"All-out","m":"用盡全力的、全面的","ex":"The company launched an all-out effort to improve product quality.","cn":"公司全力以赴提昇產品品質。","cz":["The company launched an ","all-out"," effort to improve product quality."],"v":"All-out","t":["名詞・形容詞・術語"],"h":""},{"l":"A","p":"Assortment of","m":"各式各樣的","ex":"The bakery offers a wide assortment of fresh pastries every morning.","cn":"這間麵包店每天早晨提供各式各樣的新鮮糕點。","cz":["The bakery offers a wide ","assortment of"," fresh pastries every morning."],"v":"Assortment of","t":["名詞・形容詞・術語"],"h":"","pp":["The bakery offers a wide assortment ","of"," fresh pastries every morning."],"pd":["to","with","for","on","in","into","from","at","by","about","as"]},{"l":"A","p":"Add up","m":"合計、合理","ex":"His explanation doesn't add up, something is clearly missing.","cn":"他的解釋合不起來，顯然有些隱情。","cz":["His explanation doesn't ","add up",", something is clearly missing."],"v":"Add up","t":["動詞片語"],"h":"add"},{"l":"A","p":"Academic credential","m":"學歷、學術憑證","ex":"Make sure to include your academic credentials on your resume.","cn":"請務必在履歷表上附上您的學歷背景。","cz":["Make sure to include your ","academic credentials"," on your resume."],"v":"Academic credential","t":["名詞・形容詞・術語"],"h":""},{"l":"B","p":"Be supposed to","m":"應該","ex":"We are supposed to submit our weekly report by Friday afternoon.","cn":"我們應該在星期五下午前提交週   $("cats").innerHTML=CFG.cats.map(c=>`<button class="chip" data-t="${c}" aria-pressed="${on(c)}">${c}<small>${n(c)}</small></button>`).join("")+
    `<button class="chip" data-t="!" aria-pressed="${S.wrong}">錯題本<small>${store.get().size}</small></button>`;
  $("series").innerHTML=CFG.series.map(c=>`<button class="chip" data-t="${c}" aria-pressed="${on(c)}">${c}<small>${n(c)}</small></button>`).join("");
  $("counts").innerHTML=[10,20,30,0].map(k=>`<button class="chip" data-c="${k}" aria-pressed="${S.count==k}">${k||"全部"}</button>`).join("");
  const dis=S.wrong&&store.get().size==0;$("start").disabled=$("rev").disabled=dis;
}
$("modes").onclick=e=>{const b=e.target.closest("[data-m]");if(b){S.mode=b.dataset.m;home()}};
$("counts").onclick=e=>{const b=e.target.closest("[data-c]");if(b){S.count=+b.dataset.c;home()}};
const tag=e=>{const b=e.target.closest("[data-t]");if(!b)return;const t=b.dataset.t;
  if(t=="!"){S.wrong=!S.wrong;S.sel.clear()}else{S.wrong=false;S.sel.has(t)?S.sel.delete(t):S.sel.add(t)}home()};
$("cats").onclick=$("series").onclick=tag;
function pool(){const w=store.get();return D.filter(x=>S.wrong?w.has(x.id):(!S.sel.size||x.t.some(t=>S.sel.has(t))))}

/* ---------- review cards ---------- */
let R=[],ri=0,flip=false;
$("rev").onclick=()=>{R=shuffle(pool());ri=0;if(R.length){go("review");card()}};
$("rq").onclick=()=>go("home");
function card(){
  if(ri>=R.length){go("home");return}
  const it=R[ri];flip=false;$("rb").style.width=(ri/R.length*100)+"%";$("rn").textContent=`第 ${ri+1} / ${R.length} 張`;
  $("card").innerHTML=`<span class="cp">${esc(it.p)}</span><span class="ct">點一下翻面（空白鍵）</span>`;$("rbtn").innerHTML="";
}
function flipCard(){if(flip||ri>=R.length)return;flip=true;const it=R[ri];
  $("card").innerHTML=`<span class="cp">${esc(it.p)}</span><span class="cm">${esc(it.m)}</span><span class="ce">${esc(it.ex)}</span><span class="cc">${esc(it.cn)}</span>`;
  $("rbtn").innerHTML=`<button class="go alt" id="rk">還不熟</button><button class="go" id="rg">記得了</button>`;
  $("rk").onclick=()=>{const w=store.get();w.add(it.id);store.set(w);ri++;card()};
  $("rg").onclick=()=>{ri++;card()}}
$("card").onclick=flipCard;

/* ---------- quiz ---------- */
let Q=[],qi=0,right=0,wrongNow=[],locked=false;
function fixCase(s,ref){return s.charAt(0)[/^[A-Z]/.test(ref)?"toUpperCase":"toLowerCase"]()+s.slice(1)}
function build(it,type){
  if(type=="cloze"&&!it.cz)type="p2m";
  if(type=="prep"&&!it.pp)type=it.cz?"cloze":"p2m";
  if(type=="prep"){const ds=shuffle(it.pd).slice(0,3);return{type,it,ans:it.pp[1],opts:shuffle([it.pp[1],...ds])}}
  if(type=="cloze"){
    const ans=it.cz[1],wc=ans.split(" ").length,last=lc(it.v.split(" ").pop());
    const k=v=>((it.h&&v.h==it.h)?0:(lc(v.v.split(" ").pop())==last)?10:20)+Math.abs(v.cz[1].split(" ").length-wc);
    const ds=[];for(const x of shuffle(D.filter(v=>v.cz&&v.id!=it.id)).sort((a,b)=>k(a)-k(b))){
      const d=fixCase(x.cz[1],ans);if(lc(d)!=lc(ans)&&!ds.some(y=>lc(y)==lc(d)))ds.push(d);if(ds.length==3)break}
    return{type,it,ans,opts:shuffle([ans,...ds])};
  }
  const key=type=="p2m"?"m":"p",ds=[];
  const k=v=>(it.h&&v.h==it.h)?0:(v.t[0]==it.t[0]?1:2);
  for(const x of shuffle(D.filter(v=>v.id!=it.id)).sort((a,b)=>k(a)-k(b))){
    if(x[key]!=it[key]&&!ds.includes(x[key]))ds.push(x[key]);if(ds.length==3)break}
  return{type,it,ans:it[key],opts:shuffle([it[key],...ds])};
}
function begin(items){
  const types=S.mode=="mix"?["cloze","prep","p2m","m2p"]:[S.mode];let list=shuffle(items);
  if(!S.wrong&&(S.mode=="cloze"||S.mode=="prep")){const f=list.filter(i=>S.mode=="cloze"?i.cz:i.pp);if(f.length)list=f}
  if(S.count)list=list.slice(0,S.count);
  Q=list.map(it=>build(it,types[Math.random()*types.length|0]));qi=0;right=0;wrongNow=[];go("quiz");show();
}
$("start").onclick=()=>{const p=pool();if(p.length)begin(p)};
$("quit").onclick=()=>qi>0?finish():go("home");
function show(){
  const q=Q[qi],it=q.it;locked=false;$("fb").innerHTML="";
  $("pb").style.width=(qi/Q.length*100)+"%";$("pn").textContent=`第 ${qi+1} / ${Q.length} 題`;$("pt").textContent=TL[q.type];
  if(q.type=="cloze"){const[a,,b]=it.cz;$("qt").className="q";$("qt").innerHTML=`${esc(a)}<span class="blank" id="bl">${esc(q.ans)}</span>${esc(b)}`;$("qh").textContent=it.cn}
  else if(q.type=="prep"){const[a,,b]=it.pp;$("qt").className="q";$("qt").innerHTML=`${esc(a)}<span class="blank" id="bl">${esc(q.ans)}</span>${esc(b)}`;$("qh").textContent=it.cn}
  else if(q.type=="p2m"){$("qt").className="q";$("qt").textContent=it.p;$("qh").textContent="選出正確的中文意思"}
  else{$("qt").className="q cn";$("qt").textContent=it.m;$("qh").textContent="選出對應的英文片語"}
  $("qo").innerHTML=q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("");
}
function fam(it){if(!it.h)return"";const f=D.filter(x=>x.h==it.h&&x.id!=it.id);if(!f.length)return"";
  return`<p class="fam">同系列：${f.slice(0,6).map(x=>`<b>${esc(x.p.split(" / ")[0])}</b> ${esc(short(x.m))}`).join("　")}</p>`}
function pick(i){
  if(locked)return;locked=true;const q=Q[qi],ok=q.opts[i]==q.ans,w=store.get(),it=q.it;
  [...$("qo").children].forEach((b,j)=>{b.disabled=true;if(q.opts[j]==q.ans)b.classList.add("ok");else if(j==i)b.classList.add("ng")});
  const bl=$("bl");if(bl)bl.classList.add(ok?"ok":"ng");
  if(ok){right++;w.delete(it.id)}else{w.add(it.id);wrongNow.push(it)}store.set(w);
  const last=qi==Q.length-1;
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"ng"}"><p class="t">${ok?"答對了":"答錯了"}　${esc(it.p)}：${esc(it.m)}</p><p class="en">${esc(it.ex)}</p><p>${esc(it.cn)}</p><p class="fam">分類：${esc(it.t[0])}</p>${fam(it)}</div><button class="next" id="nx">${last?"看結果":"下一題"}</button>`;
  $("nx").onclick=()=>{qi++;qi>=Q.length?finish():show()};$("nx").focus();
}
$("qo").onclick=e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.i)};
document.addEventListener("keydown",e=>{
  if(!$("quiz").classList.contains("hide")&&!locked&&e.key>="1"&&e.key<="4"&&Q[qi].opts[e.key-1]!==undefined)pick(e.key-1);
  if(!$("review").classList.contains("hide")&&e.key==" "){e.preventDefault();flipCard()}});
function finish(){
  const done=locked?qi+1:qi;$("sc").textContent=`${right} / ${done}`;
  $("wl").innerHTML=wrongNow.length?wrongNow.map(i=>`<li><b>${esc(i.p)}</b>：${esc(i.m)}<small>${esc(i.ex)}</small></li>`).join(""):"<li>全部答對，沒有錯題。</li>";
  $("ract").innerHTML=(wrongNow.length?`<button class="sec" id="rr">重練這 ${wrongNow.length} 題</button>`:"")+`<button class="sec" id="rh">回到首頁</button>`;
  if($("rr"))$("rr").onclick=()=>{const ids=new Set(wrongNow.map(x=>x.id)),c=S.count,w=S.wrong;S.count=0;S.wrong=true;begin(D.filter(x=>ids.has(x.id)));S.count=c;S.wrong=w};
  $("rh").onclick=()=>go("home");go("result");
}
home();
</script>
</body>
